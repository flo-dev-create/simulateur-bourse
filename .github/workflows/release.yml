name: Build & Release Windows & Android

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Compiler Electron (.exe)
        run: npm run electron:dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Sauvegarder artefact Windows
        uses: actions/upload-artifact@v4
        with:
          name: windows-artifact
          path: dist-electron/*.exe

  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Installer les dépendances
        run: npm install

      - name: Build web et sync Capacitor
        run: |
          npm run build
          npx cap sync android

      - name: Droits d'exécution Gradle
        run: chmod +x android/gradlew

      - name: Compiler APK Android
        run: |
          cd android
          ./gradlew assembleDebug

      - name: Renommer le binaire
        run: cp android/app/build/outputs/apk/debug/app-debug.apk Simulateur-Bourse.apk

      - name: Sauvegarder artefact Android
        uses: actions/upload-artifact@v4
        with:
          name: android-artifact
          path: Simulateur-Bourse.apk

  publish-release:
    needs: [build-windows, build-android]
    runs-on: ubuntu-latest
    steps:
      - name: Télécharger artefact Windows
        uses: actions/download-artifact@v4
        with:
          name: windows-artifact
          path: release-assets

      - name: Télécharger artefact Android
        uses: actions/download-artifact@v4
        with:
          name: android-artifact
          path: release-assets

      - name: Publier sur GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: release-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}